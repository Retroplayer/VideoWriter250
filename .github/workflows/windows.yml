name: Windows recovery build

on:
  push:
    branches: [main, feature/windows-recovery-build]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Visual C++ environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows x64 executable
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /W3 /O2 /std:c11 /Fe:build\vwrecover.exe src\vwrecover.c

      - name: Create synthetic filesystem test disk
        shell: pwsh
        run: python tests/make_fixture.py "$env:RUNNER_TEMP\fixture.img"

      - name: Run recovery smoke test
        shell: pwsh
        run: |
          & .\build\vwrecover.exe "$env:RUNNER_TEMP\fixture.img" extract "$env:RUNNER_TEMP\recovered"
          if ($LASTEXITCODE -ne 0) { throw "Recovery command failed" }
          $text = Get-Content "$env:RUNNER_TEMP\recovered\00_Test_Document.txt" -Raw
          if ($text -notmatch 'Grandma test note') { throw "Recovered text does not match fixture" }
          if (-not (Test-Path "$env:RUNNER_TEMP\recovered\00_Test_Document.rtf")) { throw "RTF missing" }
          Write-Host "Recovery fixture passed."

          python tests/make_imd_fixture.py "$env:RUNNER_TEMP\fixture.img" "$env:RUNNER_TEMP\fixture.imd"
          & .\build\vwrecover.exe "$env:RUNNER_TEMP\fixture.imd" extract "$env:RUNNER_TEMP\imd-recovered"
          if ($LASTEXITCODE -ne 0) { throw "IMD extraction failed" }
          $imdText = Get-Content "$env:RUNNER_TEMP\imd-recovered\00_Test_Document.txt" -Raw
          if ($imdText -notmatch 'Grandma test note') { throw "IMD extracted text incorrect" }
          Write-Host "IMD compressed/interleaved/sector-map regression passed."
          python tests/make_imd_fixture.py "$env:RUNNER_TEMP\fixture.img" "$env:RUNNER_TEMP\bad.imd" bad-data
          & .\build\vwrecover.exe "$env:RUNNER_TEMP\bad.imd" extract "$env:RUNNER_TEMP\bad-recovered"
          if ($LASTEXITCODE -eq 0) { throw "CRC-bad document sector was falsely exported" }
          $global:LASTEXITCODE = 0
          if (Test-Path "$env:RUNNER_TEMP\bad-recovered\00_Test_Document.txt") { throw "Bad sector silently exported to text" }
          Write-Host "IMD CRC-damaged sector rejection passed."
          python tests/make_imd_fixture.py "$env:RUNNER_TEMP\fixture.img" "$env:RUNNER_TEMP\missing.imd" missing-data
          & .\build\vwrecover.exe "$env:RUNNER_TEMP\missing.imd" extract "$env:RUNNER_TEMP\missing-recovered"
          if ($LASTEXITCODE -eq 0) { throw "Missing document sector was falsely exported" }
          $global:LASTEXITCODE = 0
          if (Test-Path "$env:RUNNER_TEMP\missing-recovered\00_Test_Document.txt") { throw "Missing sector silently exported to text" }
          Write-Host "IMD missing sector rejection passed."
          python tests/make_short_fixture.py "$env:RUNNER_TEMP\\short.img"
          & .\\build\\vwrecover.exe "$env:RUNNER_TEMP\\short.img" extract "$env:RUNNER_TEMP\\shortrecovered"
          if ($LASTEXITCODE -ne 0) { throw "Short-document extraction failed" }
          $shortText = Get-Content "$env:RUNNER_TEMP\\shortrecovered\\00_Document1.txt" -Raw
          if ($shortText.TrimEnd() -cne 'Hello World!') { throw "Short-document text contains wrong bytes: $shortText" }
          $raw = [System.IO.File]::ReadAllBytes("$env:RUNNER_TEMP\\shortrecovered\\00_Document1.bin")
          if ($raw.Length -ne 70 -or $raw[27] -ne 255) { throw "Lossless raw document changed" }
          Write-Host "VW1 short-document regression passed."
          & .\build\vwrecover.exe drive 9 extract
          if ($LASTEXITCODE -ne 2) { throw "Invalid drive selector was not rejected" }
          $global:LASTEXITCODE = 0
          Write-Host "Drive selector validation passed."

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item build\vwrecover.exe release\vwrecover.exe
          Copy-Item README.md release\README.md
          Compress-Archive -Path release\* -DestinationPath vwrecover-windows-x64.zip

      - name: Upload downloadable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: vwrecover-windows-x64
          path: vwrecover-windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" vwrecover-windows-x64.zip --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --prerelease --notes "Read-only VideoWriter 250 document recovery preview. Greaseweazle hardware path remains unverified."
